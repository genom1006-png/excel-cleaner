name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 경량화 빌드 및 최적화 패키징
        run: |
          pip install pywin32 tkinterdnd2 pyinstaller
          pyinstaller --onefile --noconsole --clean --optimize 2 --collect-all tkinterdnd2 --exclude-module unittest --exclude-module email --exclude-module html --exclude-module http --exclude-module urllib --exclude-module xml --exclude-module pydoc --exclude-module doctest --exclude-module sqlite3 --exclude-module ssl excel_cleaner_app.py

      - name: 완성된 EXE 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: excel-cleaner-exe
          path: dist/excel_cleaner_app.exe
